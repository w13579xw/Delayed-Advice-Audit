[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daci-research"
version = "0.1.0"
description = "Research prototype for delay-aware counterfactual intervention"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
sim = ["gymnasium==1.2.3", "gymnasium-robotics==1.4.2", "mujoco==3.3.7"]
dev = ["pytest>=7,<9"]
plot = ["matplotlib>=3.7"]

[project.scripts]
daci = "daci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
